name: Test default (current commit) lookup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT_ID: ${{ steps.action.outputs.id }}
          RESULT_TAG: ${{ steps.action.outputs.tag_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $RESULT_ID tag: $RESULT_TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT_ID" ] || [ -z "$RESULT_TAG" ]; then
              echo "FAIL: action succeeded but outputs are empty"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable / no release)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
