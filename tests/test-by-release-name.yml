name: Test release by name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseName: My Release
          searchLimit: '10'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT_NAME: ${{ steps.action.outputs.name }}
          RESULT_ID: ${{ steps.action.outputs.id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $RESULT_NAME id: $RESULT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT_NAME" != "My Release" ] || [ -z "$RESULT_ID" ]; then
              echo "FAIL: expected name 'My Release' and non-empty id"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
