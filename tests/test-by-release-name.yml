name: Test by releaseName input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          releaseName: 'v4.2.2'
          repo: 'actions/checkout'
          searchLimit: '10'
        continue-on-error: true
      - name: Assert action ran and returned a release or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_NAME: ${{ steps.action.outputs.name }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_name: $RELEASE_NAME"
          echo "release_id: $RELEASE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: got release name '$RELEASE_NAME' id '$RELEASE_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API not reachable or release not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
