name: Test release by id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: '12345'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT_ID: ${{ steps.action.outputs.id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $RESULT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT_ID" != "12345" ]; then
              echo "FAIL: expected id 12345"
              exit 1
            fi
            echo "PASS: got release id $RESULT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
