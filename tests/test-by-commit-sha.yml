name: Test get release by commitSha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          commitSha: 'abc1234567890abcdef1234567890abcdef12345'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ID: ${{ steps.action.outputs.id }}
          TAG: ${{ steps.action.outputs.tag_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $ID"
          echo "tag_name: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: got release id '$ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or commit not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
