name: "integration-test"
on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buildAndTest:
    env:
      PACKED_JS_PATH: 'dist/index.js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Use Node.js
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 16.x
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
        env:
          GITHUB_TOKEN: ${{ github.token }}
